services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: benchmark-playwright
    working_dir: /workspace
    command: sleep infinity
    shm_size: 1gb
    volumes:
      - ./:/workspace
    environment:
      BASE_URL: http://proxy-nginx-dev
    depends_on:
      proxy-nginx-dev:
        condition: service_started
